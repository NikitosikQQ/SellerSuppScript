; Настройки цехового скрипта — откат нововведений без замены exe.
;
; Как пользоваться: скопируйте этот файл рядом с exe под именем ss_settings.ini,
; поправьте нужную строку и перезапустите программу. Файла нет — работает новое поведение.
;
; ОТКАТ ЦЕЛИКОМ на поведение 26.10.5 — одна строка:
;   [general]
;   mode = legacy
;
; ОТКАТ ПО ОТДЕЛЬНОСТИ — нужные строки ниже (on/off, числа). Строка в файле важнее mode.

[general]
; new — новое поведение, legacy — как в 26.10.5
mode = new

[pila]
; Очередь печати: скан не ждёт печати. off — скан ждёт проверки и печати, как в 26.10.5.
print_queue = on
; Сколько наклеек склеивать в одну печать (1 — без склейки).
batch_max = 5
; Номер заказа текстом под QR. off — только QR.
label_text = on
; Проверка заказа: таймаут 5+8 с и один повтор при сетевой ошибке. off — 15 с без повтора.
; Если у WB проблемы (проверка WB-заказов долго «висит» или падает) — поставьте off.
fast_validate = on
; Один повтор отметки работы, если соединение с сервером не установилось (запрос точно не ушёл).
; Если запрос ушёл, но ответ не пришёл — повтора нет (иначе возможно двойное начисление).
mark_retry = on
; Не ставить в очередь повторный скан, пока тот же заказ ещё ждёт печати.
dedupe = on

[print]
; Все посты. Не давать окнам печати (PDF-XChange) забирать фокус — иначе сканы теряются.
focus_lock = on
; Таймаут PDFtoPrinter, секунд (в 26.10.5 — 60).
timeout_s = 30
; По таймауту завершать всё дерево процессов печати.
kill_tree = on
