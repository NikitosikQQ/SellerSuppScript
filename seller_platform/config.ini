; Конфигурация форка упаковщика под Seller Platform.
; Лежит РЯДОМ с .exe (или с main.py при запуске из исходников) и редактируется на месте —
; пересборка не нужна при смене хоста.
[api]
; Базовый URL бэкенда seller-platform (без /api/v1 и без завершающего слэша).
; Локальная разработка: http://localhost:8082 ; прод — https://<домен-заказчика>.
host = http://localhost:8082

; verify_ssl=true — проверять TLS-сертификат (на проде ОБЯЗАТЕЛЬНО true).
; false допустимо только для локальной отладки с self-signed/без https.
verify_ssl = false
